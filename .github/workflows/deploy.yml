name: Deploy to Shared Hosting

on:
  push:
    branches:
      - main   # change to "master" if that's your default branch

jobs:
  sftp-deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          local_path: './public/*'          # everything in repo root - you adjust if index.html is in a subfolder
          remote_path: '/public_html' # adjust if FileZilla shows a different path
          sftpArgs: '-o ConnectTimeout=5'

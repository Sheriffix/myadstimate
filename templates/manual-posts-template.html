<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Google Preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Title — always plain text, never use TITLE_DISPLAY here -->
  <title>{{TITLE}}</title>
  <!-- Meta Tags -->
  <meta name="description" content="{{META-DESC}}" />
  <meta name="robots" content="index, follow" />
  <!-- Canonical link -->
  <link rel="canonical" href="https://adstimate.com/blog/{{SLUG}}" />
  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
  <!-- Google Fonts and Icons -->
  <link
    href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,600;1,600&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <!-- Stylesheets -->
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/custom.css" />
  <link rel="stylesheet" href="/blog.css" />
  <!-- Open Graph tags — plain title only, no HTML tags allowed here -->
  <meta property="og:title" content="{{TITLE}}" />
  <meta property="og:description" content="{{META-DESC}}" />
  <meta property="og:type" content="article" />
  <meta property="og:url" content="https://adstimate.com/blog/{{SLUG}}" />
  <meta property="og:image" content="https://adstimate.com/img/{{SLUG}}.png" />

  <!-- BlogPosting + BreadcrumbList schema — always present on every post -->
  <script type="application/ld+json">
    [
      {
        "@context": "https://schema.org",
        "@type": "BlogPosting",
        "headline": "{{TITLE}}",
        "description": "{{META-DESC}}",
        "author": { "@type": "Organization", "name": "Adstimate" },
        "publisher": {
          "@type": "Organization",
          "name": "Adstimate",
          "logo": { "@type": "ImageObject", "url": "https://adstimate.com/adstimate_logo.png" }
        },
        "datePublished": "{{DATE-PUBLISHED}}",
        "dateModified": "{{DATE-MODIFIED}}",
        "mainEntityOfPage": {
          "@type": "WebPage",
          "@id": "https://adstimate.com/blog/{{SLUG}}"
        }
      },
      {
        "@context": "https://schema.org",
        "@type": "BreadcrumbList",
        "itemListElement": [
          {
            "@type": "ListItem",
            "position": 1,
            "name": "Home",
            "item": "https://adstimate.com/"
          },
          {
            "@type": "ListItem",
            "position": 2,
            "name": "Blog",
            "item": "https://adstimate.com/blog/"
          },
          {
            "@type": "ListItem",
            "position": 3,
            "name": "{{TITLE}}",
            "item": "https://adstimate.com/blog/{{SLUG}}"
          }
        ]
      }
    ]
  </script>

  <!-- FAQ schema — only rendered when this post has FAQs in faqs.json -->
  <!-- If no FAQs exist for this post, this token renders as empty string -->
  {{FAQ_SCHEMA}}

</head>

<body>
  <header class="header">
    <div id="site-header">
    </div>
  </header>

  <main class="page-content blog-page">
    <div class="container">

      <section class="blog-hero">
        <nav class="breadcrumb-nav">
          <a href="/">Home</a> <i class="material-icons theme-icon">chevron_right</i> <a href="./index">Blog</a>
        </nav>
        <!-- TITLE_DISPLAY is used here — it can contain <span>, <br> etc -->
        <!-- The plain TITLE token is still used everywhere else (meta, schema, og) -->
        <h1 class="title">{{TITLE_DISPLAY}}</h1>
        <p class="subtitle">{{SUBTITLE}}</p>
        <p class="post-meta">Published: {{DATE-PUBLISHED-READABLE}}</p>
      </section>

      <article class="main-article-text">
        {{BLOG-CONTENT}}
      </article>

      <section class="related-articles-section">
        <h2>Related Articles</h2>
        <div id="related-articles-container"></div>
      </section>

    </div>
  </main>

  <footer class="footer">
    <div id="site-footer"></div>
  </footer>

  <!-- Load widget script -->
  <script src="/scripts/mini-calculator-widget.js"></script>

  <script src="/script.js" defer></script>
  <script src="/nav.js" defer></script>

  <script src="/scripts/related-articles-widget.js"></script>
  <script>
    loadRelatedArticles(); // Auto-detect from URL
  </script>

</body>

</html>
